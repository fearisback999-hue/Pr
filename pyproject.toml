[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-shop-intelligence"
version = "0.1.0"
description = "TikTok Shop Product Intelligence Engine — detection-first product research, scoring, and creative orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.69.0"]
feeds = ["requests>=2.31.0"]
dev = ["pytest>=8.0"]

[project.scripts]
tt-engine = "tt_engine.cli:main"

[tool.setuptools.packages.find]
include = ["tt_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Deliberate house style: 110-col lines keep the data-heavy dataclasses and f-string
# status lines readable without awkward wrapping.
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E741: short single-letter names (s, m, e) read fine in this numeric/score-heavy code.
ignore = ["E741"]
